name: update-data

on:
  schedule:
    - cron: "30 9 * * 1-5"   # UTC 09:30 = 한국시간 평일 18:30 (KAMIS는 평일 조사)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Collect
        run: python collect.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: Commit data.json
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "update data" && git push)
